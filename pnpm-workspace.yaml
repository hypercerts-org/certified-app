# Dependencies whose install scripts may run. pnpm blocks them by default;
# list each one explicitly. core-js only prints a funding notice.
allowBuilds:
  core-js: false
minimumReleaseAgeExclude:
  - "@hypercerts-org/ui-react@0.3.4"
  - "@hypercerts-org/api@0.4.0"
  - "@hypercerts-org/certified-group-service@0.2.0"
