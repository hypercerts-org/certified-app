name: CI

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the version pinned in package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The script generates the lexicon bindings before running tsc.
      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # The previous app's unit and Playwright suites lived here. v2 has no tests
  # yet; add the jobs back as they arrive.
