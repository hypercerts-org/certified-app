name: CI

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Through npm so pretypecheck generates the lexicon bindings first.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # The previous app's unit and Playwright suites lived here. v2 has no tests
  # yet; add the jobs back as they arrive.
